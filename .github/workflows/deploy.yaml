name: Validate Digital Kraft

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: digital-kraft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run check

